name: continuous-fuzz
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.11'
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Failure gates and resource outcomes
        run: |
          python3 -m unittest discover -s evidence -p 'test_*.py'
          python3 -m unittest discover -s chassis/tests -p 'test_*.py'
          python3 chassis/tests/test_triage.py
          python3 chassis/resource_oracle.py --selftest
      - name: Validate evidence and generated view
        run: |
          python3 evidence/tool.py --check --render
          git diff --exit-code -- evidence/claims.md
      - name: Syntax and target inventory
        run: python3 chassis/check_repository.py
  differential-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.12'
      - name: Install exact regression environment
        run: python3 -m pip install --require-hashes -r targets/tokenizers_differential/requirements-linux-py310.lock
      - name: Pair acceptance and failure behavior
        run: python3 targets/tokenizers_differential/test_harness.py
# Target campaigns are paused pending the promotion gates in docs/TARGETS.md.
# Local campaigns use python3 -m chassis.campaign. No crash logs or artifacts
# are automatically published by this workflow.
