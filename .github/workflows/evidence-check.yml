name: evidence-base
on:
  push:
    paths: ['evidence/**', '.github/workflows/evidence-check.yml']
  pull_request:
    paths: ['evidence/**', '.github/workflows/evidence-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.11'
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 -m unittest discover -s evidence -p 'test_*.py'
      - run: python3 evidence/tool.py --check --render
      - run: git diff --exit-code -- evidence/claims.md
