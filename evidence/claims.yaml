- id: C-0034
  date: 2026-08-13
  target: gguf
  entry_point: gguf_init_from_buffer
  statement: >
    Current llama.cpp GGUF is hardened against resource-exhaustion (declared-huge)
    inputs; bounds and overflow guards are present.
  kind: negative
  confidence: verified
  provenance:
    - source-read:gguf.cpp nbytes_remain checks (269/285/292/349/358)
    - source-read:gguf.cpp n_tensors/n_kv bounds vs SIZE_MAX/sizeof (13/24)
    - source-read:gguf.cpp dimension-product overflow guard (685-687)
    - machine-run:58M runs clean after 5-hunk fuzz-blocker patch
  observation: >
    Declared sizes checked vs remaining file bytes; n_tensors/n_kv bounded;
    dimension product overflow-guarded. 58M runs clean with blockers applied.
  boundary: >
    Scoped to metadata/tensor-descriptor parsing with no_alloc=true, at commit
    432d7ffe. This configuration does NOT exercise the allocation-size-computation
    path (no_alloc skips allocation), which is where the GGUF integer-overflow CVE
    class lives: CVE-2025-53630 and its bypass CVE-2026-27940 (gguf_init_from_file
    _impl undersized heap alloc), oss-sec V-01..V-06 (2026-05-15, GGML_PAD/string/
    n_dims/blck_size), and Talos 2024 (gguf_fread_str/ne/n_tensors heap overflows).
    Those remain an active, repeatedly-reopened class NOT covered by this harness.
    The declared-huge/resource-exhaustion negative holds only for the no_alloc
    descriptor-parse surface; it is not a claim that GGUF loading is memory-safe.
    The 5 bugs this harness reproduced are pre-existing/duplicate, not new findings.
  status: active
  refs: [targets/gguf/, docs/RELATED-WORK.md]

