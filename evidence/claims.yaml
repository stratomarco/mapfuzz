    - source-read sampling_params.py _validate_allowed_token_ids rejects any id that is negative or at least vocab_size, called from verify with the tokenizer on the SamplingParams path in input_processor.py line 97
    - source-read v1 sample ops bad_words.py applies the mask via a slice assignment logits last_token_id to last_token_id plus 1, which clamps silently and cannot go out of bounds
    - source-read gpu_input_batch.py builds allowed_token_ids_mask sized to vocab_size, and the raw ids reaching the fancy-index are gated by the model-aware validator upstream
  observation: >
    Traced the token-id-as-index seam through three consumers. The bad_words path
    is safe by slice-clamp semantics. The allowed_token_ids path is guarded by a
    deferred model-aware validator that runs once vocab is known, the correct place
    for a check the request layer cannot make. The second verify call site is for
    PoolingParams, a different parameter type, not a bypass of the SamplingParams check.
  boundary: >
    Scoped to the sampling-parameter token-id fields on the SamplingParams path in
    a current vLLM checkout, tokenizer-present mode only. The tokenizer-absent gap
    is no longer hypothetical, C-0026 confirmed in-process that the vocab check is
    skipped when tokenizer is None and the mask fancy-index then raises IndexError.
    So this claim must be read strictly as tokenizer-present, with C-0026 as the
    exception. Extends the seam-checking pattern into the serving runtime for the
    default (tokenizer-present) path only.
  severity: none
  status: active
  refs: [docs/THREAT-MODEL.md, docs/M0-baseline-audit.md]

# ---- Triton request-path memory-corruption seams: defended (audit) ----
- id: C-0060
  date: 2026-08-19
  target: triton
  entry_point: shape-size math GetElementCount and GetByteSize, and shared-memory GetMemoryInfo
  statement: >
    Triton's request-path memory-corruption seams are defended with explicit
    overflow guards. The shape-to-bytes multiply checks each product against
    INT64_MAX before multiplying, and the shared-memory offset-plus-byte-size path
    checks byte_size against SIZE_MAX minus offset before adding, then bounds the
    result against the registered region size.
  kind: audit
  confidence: verified
  provenance:
    - source-read model_config.h GetElementCount checks cnt greater than INT64_MAX over dim before each multiply and returns an overflow sentinel, and handles wildcard and negative dims
    - source-read model_config.h GetByteSize checks cnt greater than INT64_MAX over dt_size before the element-times-dtype multiply and propagates the overflow sentinel
    - source-read shared_memory_manager.cc GetMemoryInfo line 477 checks byte_size greater than SIZE_MAX minus offset before the addition, after bounding offset against region size at 469, then checks the sum against region size at 490 before handing out the pointer at 503
  observation: >
    Deliberately hunted memory corruption rather than DoS at the two highest-risk
    spots in a mature serving runtime, the shape-size arithmetic and the
    shared-memory offset-plus-size path. Both apply the overflow-safe formulation,
    with a comment showing the overflow was consciously considered. The shared
    memory path is the single most likely out-of-bounds source in a serving runtime
    and it is closed.
  boundary: >
    Scoped to the request-path size arithmetic and shared-memory bounds in a
    current Triton checkout. The model repository remains trusted by NVIDIA's
    documented threat model and was not treated as an attack surface. The result
    extends the maintained-core-hardened finding to the memory-corruption tier on a
    serving runtime, both DoS-class and overflow-class seams are defended.
  severity: none
  status: active
  refs: [docs/THREAT-MODEL.md, docs/M0-baseline-audit.md]

# ---- TensorRT-LLM unguarded head_size division: robustness non-finding ----
- id: C-0025
  date: 2026-08-19
  target: tensorrt_llm
  entry_point: PretrainedConfig __init__ via from_checkpoint and from_json_file
  statement: >
    TensorRT-LLM computes head_size as hidden_size floor-divided by
    num_attention_heads without validating that num_attention_heads is positive.
    A checkpoint config.json with num_attention_heads set to 0 reaches the division
    and raises ZeroDivisionError on load. This is a low-severity robustness gap,
    not a security finding, checkpoint loading is a trusted-input offline build
    step per the documented conversion workflow.
  kind: non-finding
  confidence: verified
  provenance:
    - source-read modeling_utils.py line 447 head_size = hidden_size floordiv num_attention_heads with no positivity check anywhere in __init__
    - source-read modeling_utils.py from_json_file line 511 json.load then from_dict, from_dict line 496 config_cls of the file dict as kwargs, from_checkpoint line 526 loads config.json by the same path
    - reachability confirmed by source-read, a crafted config.json with num_attention_heads 0 reaches the division
  observation: >
    A sibling issue at line 494 MODEL_MAP indexed by config architecture raises
    KeyError on an unknown architecture string, same DoS-on-load class, also a dict
    lookup not a dynamic import so not a code-execution class. Both are
    crash-on-malformed-config robustness gaps at model load.
  boundary: >
    Reachable from a checkpoint config file. Severity low, the impact is a raw
    ZeroDivisionError instead of a clean ValueError at load, during an offline
    developer-run conversion or build step, not a running multi-tenant request path.
    No documented claim that TRT-LLM safely loads untrusted checkpoints, and
    model-conversion tooling is treated as trusted input across the ecosystem, so
    this is recorded as a robustness non-finding by the implicit threat model, not a
    vulnerability. A one-line hardening (validate num_attention_heads greater than 0
    and raise a clear error) would fix it, held for possible future private report.
  severity: low
  status: active
  refs: [docs/THREAT-MODEL.md]

# ---- vLLM skip-tokenizer-init allowed_token_ids vocab-check gap: robustness observation ----
- id: C-0026
  date: 2026-08-28
  target: vllm
  entry_point: SamplingParams _validate_allowed_token_ids and gpu_input_batch mask build
  statement: >
    In vLLM 0.28.0 the allowed_token_ids vocab-bounds check is gated on a tokenizer
    being present, so when tokenizer is None (skip-tokenizer-init mode) an
    out-of-vocab token id passes validation, and the mask-build fancy-index would
    raise IndexError on that id. In normal tokenizer-present deployments this is
    fully defended. Remote reachability in skip-tokenizer-init mode is unconfirmed.
    Low severity, non-default mode, DoS ceiling.
  kind: non-finding
  confidence: verified
  provenance:
    - executed sampling_params _validate_allowed_token_ids with tokenizer None passed an out-of-vocab id 999999999 with no rejection, in vllm 0.28.0
    - executed the same validator with a tokenizer present and it raised VLLMValidationError rejecting the out-of-vocab id, confirming the defended path
    - reproduced the gpu_input_batch operation mask req_index indexed by the id equals False on a bool tensor of width 151936, which raised IndexError index 999999999 out of bounds
    - source-read completion serving.py line 176 to_sampling_params is called with no tokenizer and no verify call in that path, so verification is deferred to the engine where tokenizer is None under skip-tokenizer-init
  observation: >
    Confirmed empirically in-process that the vocab check is skipped when tokenizer
    is None and that the downstream fancy-index raises IndexError. Did not confirm
    whether the OpenAI server routes a request allowed_token_ids to that path in
    skip-tokenizer-init mode, full-server testing was blocked by WSL2 lacking UVA
    so the live request path could not be exercised on this host.
  boundary: >
    Requires the non-default --skip-tokenizer-init deployment mode. Normal
    deployments pass a real tokenizer and are defended, confirmed. Severity ceiling
    DoS (IndexError), not memory corruption. Blast radius (per-request vs worker)
    and remote reachability both unconfirmed. Recorded as a low-severity robustness
    observation, the durable fix is to make the vocab check unconditional rather
    than gated on tokenizer presence. Not claimed as a remote vulnerability.
  severity: low
  status: active
  refs: [docs/THREAT-MODEL.md, docs/LESSONS.md]

# ---- NVIDIA GR00T policy-server deserialization boundary: defended (audit) ----
- id: C-0061
  date: 2026-08-28
  target: nvidia_groot
  entry_point: gr00t/policy/server_client.py MsgSerializer.from_bytes and the ZMQ run loop
  statement: >
    At the tested Isaac-GR00T revision, the policy server's deserialization
    boundary resists three specific classes, measured on the versions recorded
    below. MsgSerializer rejects object-dtype NPY and msgpack-numpy payloads
    before either decode path can unpickle attacker data. msgpack rejects the
    tested array32 and map32 declaration bombs. np.load and frombuffer reject a
    declared-shape-versus-actual-bytes mismatch with zero measured allocation.
    This is scoped to those tested inputs and versions, not a general safety
    claim, and it says nothing about authentication, which is tracked separately.
  kind: audit
  confidence: verified
  provenance:
    - versions tested GR00T commit 51d4c89f72fda44cbf77285c6a8114b52676b8a1, python 3.10.12, numpy 2.2.6, msgpack 1.1.0, msgpack-numpy 0.4.8
    - source-read server_client.py MsgSerializer._safe_decode rejects object-dtype ndarray payloads two ways before np.load or mnp.decode can unpickle, np.load is called with allow_pickle False
    - machine-run msgpack unpackb rejects a 5-byte array32 header declaring 4.29e9 elements with ValueError exceeds max_array_len, same for map32, on msgpack 1.1.0
    - machine-run measured peak RSS delta of np.load allow_pickle False on crafted NPY headers declaring 1e6, 1e8, and 5e8 float64 elements with no data was 0.0 MB each, all rejected with ValueError before allocation, on numpy 2.2.6
    - machine-run msgpack-numpy mnp.decode uses frombuffer which raises TypeError buffer is too small when declared shape exceeds actual data bytes, on msgpack-numpy 0.4.8
  observation: >
    Tested in-process against the exact from_bytes entry point with no model and no
    GPU. The NPY allocation-safety was measured, not inferred, peak RSS did not move
    for declared shapes up to 5e8 float64 because the data-length check fires before
    allocation on numpy 2.2.6. This is version-specific and was not re-tested on
    GR00T's own pinned numpy. The unauthenticated-parse structural point (token is
    inside the payload, so auth runs after from_bytes) is real but is not a defense
    and is tracked as a separate finding, not resolved here.
  boundary: >
    Scoped strictly to the three tested classes on the recorded versions. NOT a
    general claim that the boundary is safe, only that these specific inputs were
    rejected with zero measured allocation. Not tested, other numpy versions,
    live-server timing, ZMQ state-machine behavior, and handler internals. Does not
    cover authentication or authorization, which is a separate finding. A negative
    result on tested amplification inputs, not proof that no amplification exists.
  severity: none
  status: active
  refs: [docs/FRONTIER.md, docs/THREAT-MODEL.md]
