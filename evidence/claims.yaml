  observation: >
    The unbounded range() allocation is confirmed (MemoryError at 10**12). But the
    download-path site takes the range branch only when episodes is None, while its
    sole caller invokes it only when episodes is not None, so that branch is dead
    on the download path. Other sites require already-loaded data.
  boundary: >
    NOT a confirmed DoS: the OOM primitive is real but no untrusted-metadata-to-OOM
    entry path was established. Latent unbounded-allocation. The initial "download
    DoS" hypothesis was retracted after reading the caller guard. Contrast: clip
    0007 block_count is cleanly reachable.
  severity: none
  status: active
  refs: [docs/M0-baseline-audit.md]

