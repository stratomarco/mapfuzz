# ============================= METHODS (lessons) =========================

- id: C-0050
  date: 2026-08-13
  target: project
  statement: >
    Structure-STABLE encoding (fixed-layout byte decode so one flipped byte
    changes one field) turns libFuzzer byte mutations into structural mutations,
    but only pays off on a rich surface.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0002
    - machine-run:found 0003 fast on tokenizer.json (rich); no gain on pytorch corridor
  observation: >
    tokenizer.json (branchy) yielded 0003 quickly under the stable generator;
    the pytorch meta-tensor path (cov ceiling 57) showed no gain.
  boundary: >
    Effective only where the target surface is rich/branchy. On shallow corridors
    or native-C surfaces (weak coverage feedback) it does not help.
  status: active
  refs: [docs/LESSONS.md]

- id: C-0051
  date: 2026-08-13
  target: project
  statement: >
    Dedup crashes by fault LOCATION, not artifact count; many artifacts routinely
    collapse to one root cause.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0020
    - machine-run:GGUF 14,724 artifacts = 1 bug; flax ~147 flagged = 1 .keys() site
  observation: >
    14,724 GGUF artifacts deduped to one div-by-zero; 147 flax from_state_dict
    flags to one .keys() site.
  boundary: >
    Location-dedup is necessary for honest counting; it does not by itself judge
    severity (a location can be benign UB, see C-0021).
  status: active
  refs: [chassis/triage.py, docs/LESSONS.md]

- id: C-0052
  date: 2026-08-13
  target: project
  statement: >
    A UBSan flag is not a finding until confirmed to crash a non-sanitized
    release build; several UBSan hits are defined-in-practice and do not crash.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0021
    - machine-run:signed-overflow and inf->long wrap/garbage in -O2, exit 0
    - machine-run:div/mod-by-zero DO crash -O2 (SIGFPE exit 136), so ARE findings
  observation: >
    Same campaign: signed-overflow and float-cast UBSan hits render values and
    exit 0 (non-findings); div/mod-by-zero UBSan hits crash with SIGFPE
    (findings). The non-sanitized test is the discriminator.
  boundary: >
    Distinguishes real crashes from benign UB. Does not address bugs that are
    memory-unsafe only under specific allocators/platforms; ASan is the check for
    those.
  status: active
  refs: [docs/LESSONS.md]

