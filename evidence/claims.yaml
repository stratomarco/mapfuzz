# ---- clip/mmproj FINDINGS (0006, 0007) ----
- id: C-0013
  date: 2026-08-16
  target: clip_mmproj
  entry_point: clip_model_loader scalar getters / clip_init
  statement: >
    llama.cpp's mmproj loader scalar getters (get_bool/i32/u32/f32/string) check
    key presence but not GGUF type before the typed accessor, which GGML_ASSERTs
    on mismatch and aborts (SIGABRT). A wrong-typed hparam key aborts any loader
    (finding 0006).
  kind: finding
  confidence: verified
  provenance:
    - source-read:tools/mtmd/clip.cpp get_bool ~3687; typed accessors assert at gguf.cpp:194
    - machine-run:release -O2 non-sanitized, exit 134 on has_vision_encoder (get_bool) and patch_size (get_u32)
    - machine-run:coverage-guided libFuzzer+ASan+UBSan clip_init campaign
  observation: >
    Two scalar getters empirically confirmed to abort (get_bool, get_u32); class
    spans all scalar getters by shared code pattern. Array getters already validate
    type on master. Fix adds gguf_get_kv_type check before the typed accessor,
    mirroring the array-getter pattern; verified exit 134 -> clean exit 0.
  boundary: >
    DoS only (SIGABRT via failed assert); no memory corruption or code execution.
    Surface outside current OSS-Fuzz llama.cpp targets (none include clip/mtmd).
    Submitted upstream (ggml-org/llama.cpp harden-mmproj-metadata). Reproducers
    embargoed until PR merges.
  severity: low
  status: reported
  refs: [PRIVATE_findings/0006-clip-mmproj-type-confusion-abort.md]

- id: C-0014
  date: 2026-08-16
  target: clip_mmproj
  entry_point: clip_model_loader::load_tensors / clip.cpp:2156
  statement: >
    llama.cpp's mmproj loader sizes model.layers.resize(n_layer) from
    clip.vision.block_count with no bound beyond INT32_MAX and no cross-check vs
    actual tensors; a large declared block_count OOMs (std::bad_alloc) before any
    tensor is validated (finding 0007).
  kind: finding
  confidence: verified
  provenance:
    - source-read:clip.cpp:1269 block_count -> n_layer; clip.cpp:2155-2156 resize(n_layer)
    - machine-run:block_count=201326592 -> std::bad_alloc (release) / ASan OOM ~137GB
    - machine-run:n_embd/n_ff at 2e8 do NOT allocate (fail cleanly), scoping to block_count
  observation: >
    Confirmed specific to block_count. Passes get_u32's INT32_MAX cap yet still
    OOMs. Cleanly reachable on the normal load path. Fix bounds n_layer; verified
    bad_alloc -> clean exit 0. Distinct from 0006 (correctly-typed value).
  boundary: >
    DoS (resource exhaustion); no memory corruption or code execution. Submitted
    upstream in the same PR as 0006. Reproducers embargoed until PR merges.
  severity: low
  status: reported
  refs: [PRIVATE_findings/0007-clip-mmproj-block-count-alloc-dos.md]

