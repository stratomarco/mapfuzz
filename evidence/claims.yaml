# ---- gguf-py reader finding (0008) ----
- id: C-0015
  date: 2026-08-19
  target: gguf_py_reader
  entry_point: GGUFReader / _get_field_parts (ARRAY branch)
  statement: >
    gguf-py's Python GGUFReader loops range(alen) over an untrusted uint64 array
    length with no bound, no allocation guard, and no EOF-based termination, so a
    49-byte crafted GGUF (array length 2^64-1) causes unbounded time/memory
    (finding 0008).
  kind: finding
  confidence: verified
  provenance:
    - source-read:gguf-py/gguf/gguf_reader.py _get_field_parts ARRAY branch ~251-257 for idx in range(alen[0])
    - machine-run:minimized 49-byte PoC, declared array length 2^64-1
    - machine-run:GGUFReader(poc) times out at 5s (exit 124), DoS confirmed
    - machine-run:_get past EOF returns short reads without raising, so the loop does not break
  observation: >
    A KV field of type ARRAY (9) with a huge declared length drives an unbounded
    loop building growing Python lists. _get slices the mmap and returns short/empty
    arrays past EOF without raising (asked 4 uint32 past EOF, got 1, no exception),
    so the loop spins the full declared count. End-to-end timeout confirmed on a
    49-byte input.
  boundary: >
    DoS only (resource exhaustion); Python is memory-safe, no corruption or code
    execution. Root-caused to the single ARRAY-branch site. Reproducer/generator
    embargoed (PRIVATE_findings/poc_0008_gen.py) until coordinated disclosure to
    ggml-org/llama.cpp. Cross-impl: C++ reference reader guards this exact case
    (see C-0044).
  severity: low
  status: embargoed
  refs: [PRIVATE_findings/0008-gguf-py-reader-unbounded-array-dos.md]

# ---- cross-impl asymmetry audit (C++ guards it, Python does not) ----
- id: C-0044
  date: 2026-08-19
  target: gguf_py_reader
  entry_point: gguf_read_emplace_helper (C++) vs _get_field_parts (Python)
  statement: >
    For the same untrusted array-length input, the C++ GGUF reference reader in the
    same repo rejects cleanly while the Python reference reader hangs; the C++
    defenses have no Python equivalent.
  kind: audit
  confidence: verified
  provenance:
    - source-read:ggml/src/gguf.cpp gguf_read_emplace_helper returns false on short read; catches std::length_error and std::bad_alloc
    - source-read:gguf-py/gguf/gguf_reader.py ARRAY branch has no bound, no alloc guard, no short-read termination
    - claim:C-0015
  observation: >
    C++ reads the array via gr.read(value, n) with try/catch for length_error and
    bad_alloc and a false-return on short read. Python loops range(alen) with none
    of these. The maintainers already treat this input class as hostile in C++;
    the Python reference impl is the weaker of the two readers in the same project.
  boundary: >
    Establishes finding 0008 as a concrete cross-impl inconsistency, not expected
    behaviour. Lesson: a project's reference/secondary implementation may be weaker
    than its production one; fuzz the reference impl, not only the primary.
  status: active
  refs: [docs/LESSONS.md, PRIVATE_findings/0008-gguf-py-reader-unbounded-array-dos.md]

# ---- gguf-py reader: nested-array recursion robustness gap (non-finding) ----
- id: C-0024
  date: 2026-08-19
  target: gguf_py_reader
  entry_point: GGUFReader / _get_field_parts (nested ARRAY recursion)
  statement: >
    gguf-py's GGUFReader recurses through nested ARRAY-of-ARRAY fields via
    _get_field_parts with no depth guard, so a nested array deeper than Python's
    recursion limit raises an uncaught RecursionError instead of a clean
    validation error.
  kind: non-finding
  confidence: verified
  provenance:
    - machine-run:crafted nested arrays; RecursionError at default limit 1000 (nested_1000.gguf ~12KB)
    - machine-run:with recursionlimit raised to 100000, parsed to depth 20001 (confirms unbounded recursion, no internal guard)
    - source-read:C++ gguf.cpp rejects array-of-array as invalid type (no recursion); scalar-only element read
  observation: >
    Depth instrumentation confirmed real recursion to the file's nesting depth.
    At the default limit the reader raises RecursionError, a catchable exception
    that fails fast (milliseconds), not a hang. The C++ reader does not recurse
    and rejects nested arrays as an invalid element type.
  boundary: >
    NOT a DoS and much weaker than 0008: RecursionError is caller-catchable and
    fast-failing, no unbounded resource use, no corruption (contrast 0008's
    unbounded hang). It is an uncaught-unexpected-exception-type robustness gap,
    same class as the LeRobot from_dict nit (C-0022). The reader should reject
    nested/over-deep arrays with a clean ValueError like its n_dims/alignment
    guards. Low severity; recorded for completeness, no report warranted on its own.
  severity: none
  status: active
  refs: [docs/M0-baseline-audit.md, PRIVATE_findings/0008-gguf-py-reader-unbounded-array-dos.md]

