# mapfuzz Research Evidence Base - canonical claims
# Deterministic, human-auditable. See schema.md for field definitions.
# Machine-parseable YAML; a RAG layer may index this but must not replace it.

claims:

# ============================ FINDINGS ============================

- id: C-0001
  date: 2026-08-13
  target: tokenizers
  entry_point: Tokenizer::from_str / from_bytes
  statement: >
    A malformed decoder field causes a panic (process abort) at
    decoders/mod.rs:90 via .expect() on an untrusted deserialize (finding 0002).
  kind: finding
  confidence: verified
  provenance:
    - source-read:tokenizers/src/decoders/mod.rs:90
    - sandbox-run:cargo-fuzz + Atheris harness, minimized 23-byte reproducer
  observation: >
    23-byte input {"decoder":<malformed>} triggers PanicException at
    decoders/mod.rs:90. DecoderHelper::deserialize(...).expect("Helper").
  boundary: >
    DoS only (panic on load); safe Rust, no memory-safety or code-execution
    impact. Establishes one site, not the full class (see C-0002, C-0004).
  severity: low
  status: reported
  refs: [PRIVATE_findings/0002-0003-DISCLOSURE-REPORT.md]

- id: C-0002
  date: 2026-08-13
  target: tokenizers
  entry_point: Tokenizer::from_str
  statement: >
    A Precompiled normalizer with missing OR malformed precompiled_charsmap
    panics at normalizers/mod.rs:143 via .expect() (finding 0003).
  kind: finding
  confidence: verified
  provenance:
    - source-read:tokenizers/src/normalizers/mod.rs:143
    - sandbox-run:coverage-guided structure-stable generator
    - machine-run:reproduced on crates 0.21.4, 0.22.2, and 0.23.1
  observation: >
    {"type":"Precompiled"} normalizer panics: Precompiled Error("missing field
    precompiled_charsmap"). Correct pattern commented out one line above (142);
    adjacent Replace arm (146) uses map_err(serde::de::Error::custom)?.
  boundary: >
    DoS only. Same class as C-0001. Reproduced across three released versions
    (strengthens generality). Does not establish reachability in any specific
    downstream application.
  severity: low
  status: reported
  refs: [PRIVATE_findings/0002-0003-DISCLOSURE-REPORT.md]

- id: C-0003
  date: 2026-08-13
  target: tokenizers
  statement: >
    The .expect-on-untrusted-deserialize panic class is bounded to exactly two
    tokenizer components: normalizers and decoders.
  kind: finding
  confidence: verified
  provenance:
    - sandbox-run:probed 12 pre_tokenizer + 5 post_processor variants + models
    - claim:C-0001
    - claim:C-0002
  observation: >
    All 20 pre_tokenizer/post_processor variants and models reject malformed
    input cleanly (normal Exception, no PanicException) across 20+ fielded probes.
    normalizers/mod.rs:101 and :104 verified NOT reachable (reject cleanly).
  boundary: >
    Bounds the panic class to two components; does not prove the entire codebase
    is otherwise panic-free under all inputs, only the component-construction
    surface probed.
  severity: low
  status: reported
  refs: [PRIVATE_findings/0002-0003-DISCLOSURE-REPORT.md]

- id: C-0010
  date: 2026-08-13
  target: minja
  entry_point: Parser::parse
  statement: >
    minja's recursive-descent expression parser has no depth limit; deeply
    nested expressions exhaust the stack and crash (SIGSEGV) at parse time
    (finding 0004).
  kind: finding
  confidence: verified
  provenance:
    - source-read:minja.hpp (no depth/recursion guard in parseExpression chain)
    - machine-run:libFuzzer+ASan crash; deterministic PoC ~2000 nesting levels
    - machine-run:stack-size test (ulimit -s 65536 -> no crash) confirms depth-driven
  observation: >
    ASan stack-overflow; trace cycles parseExpression..parseBracedExpressionOrArray.
    Does not crash ~400 levels at 8MB stack; reliably crashes ~2000. Raising stack
    stops a given input crashing (depth-driven, not fixed-offset).
  boundary: >
    DoS via stack exhaustion; SIGSEGV is not a controllable write, no
    code-execution claim. Threshold is stack-size dependent, not a fixed count.
  severity: medium-low
  status: embargoed
  refs: [PRIVATE_findings/0004-minja-parser-recursion-dos.md]

- id: C-0011
  date: 2026-08-13
  target: minja
  entry_point: render (expression evaluation)
  statement: >
    minja performs integer division and modulo with no zero-divisor check at
    multiple sites; a zero divisor crashes the process with SIGFPE (finding 0005).
  kind: finding
  confidence: verified
  provenance:
    - source-read:minja.hpp BinaryOpExpr switch Op::Div/DivDiv/Mod ~1372-1375
    - source-read:minja.hpp Value::operator/ ~503 and operator% ~508
    - machine-run:libFuzzer render campaign, {{ 1/0 }} and {{ 57%0 }}
    - machine-run:NON-sanitized -O2 build, exit 136 (SIGFPE), not sanitizer-only
  observation: >
    {{ 1/0 }}, {{ 57%0 }}, {{ 5//0 }} all -> "Floating point exception" exit 136
    in a non-sanitized -O2 build. Controls {{ 10%3 }}->1, {{ 5/2 }}->2 OK. Five
    unguarded integer div/mod sites across two implementations.
  boundary: >
    DoS via SIGFPE; not memory corruption, no code-execution claim. Scope
    corrected to multiple sites after a deeper campaign (see C-0012).
  severity: medium-low
  status: embargoed
  refs: [PRIVATE_findings/0005-minja-division-by-zero.md]

- id: C-0012
  date: 2026-08-13
  target: minja
  statement: >
    Finding 0005's true scope is five integer div/mod sites, not the two
    originally documented; a deeper campaign surfaced the BinaryOpExpr switch
    sites (Op::Div/DivDiv/Mod) in addition to the Value operators.
  kind: correction
  confidence: verified
  provenance:
    - machine-run:render campaign hit minja.hpp:1375 (Op::Mod) via {{ 57%0 }}
    - source-read:BinaryOpExpr::do_evaluate switch lines ~1372-1375
    - claim:C-0011
  observation: >
    Original 0005 writeup listed operator/ (503) and operator% (508). The deeper
    campaign FPE'd at 1375 inside BinaryOpExpr::do_evaluate, a second independent
    modulo implementation. Non-sanitized test confirmed real SIGFPE.
  boundary: >
    Corrects scope of C-0011; does not add a new finding (same class, same crash).
    Matters for fix completeness (a partial fix of only the Value operators would
    leave the switch sites crashing).
  status: embargoed
  refs: [PRIVATE_findings/0005-minja-division-by-zero.md]

# ========================= NON-FINDINGS (calibration) =========================

- id: C-0020
  date: 2026-08-13
  target: flax_checkpoint
  entry_point: from_state_dict
  statement: >
    from_state_dict raises a raw AttributeError (not flax's SerializationError)
    when the state's type does not match the target; a robustness nit, NOT a
    security finding.
  kind: non-finding
  confidence: verified
  provenance:
    - sandbox-run:200k inputs, all ~147 flagged cases dedup to one .keys() site
    - source-read:from_state_dict dict handler calls .keys() without type check
  observation: >
    Type-mismatched state -> AttributeError "'X' object has no attribute 'keys'".
    All flagged cases (float/None/bytes/str/bool/list/int) are one root cause.
    200k further inputs found no other fault.
  boundary: >
    NOT counted as a finding: program does not crash, a caller's except still
    catches it, wrong exception type only. Worth at most a one-line upstream PR.
  severity: none
  status: active
  refs: [targets/flax_checkpoint/README.md]

- id: C-0021
  date: 2026-08-13
  target: minja
  statement: >
    minja's integer arithmetic (operator*, and inf->long via json cast) invokes
    UB on extreme operands but does NOT crash a release build; not a finding.
  kind: non-finding
  confidence: verified
  provenance:
    - machine-run:non-sanitized -O2, signed overflow wraps (INT64_MAX*2 -> -2)
    - machine-run:non-sanitized -O2, 55555555**54 renders null, %-form renders -3908
    - source-read:minja.hpp:497 operator* ; nlohmann/json.hpp:5324 float cast
  observation: >
    UBSan flagged signed-integer-overflow at minja.hpp:497 and inf-out-of-range
    at json.hpp:5324. Non-sanitized build wraps/garbage-renders and exits 0. No
    crash.
  boundary: >
    NOT counted: UBSan-only, defined-in-practice on x86, no crash in release. A
    correctness/robustness observation (arithmetic does no range checking), not a
    DoS. Only the div/mod-by-zero cases (C-0011) actually crash.
  severity: none
  status: active
  refs: [PRIVATE_findings/minja-0004-0005-DISCLOSURE-REPORT.md]

# ============================= NEGATIVES (robust surfaces) =========================

- id: C-0030
  date: 2026-08-13
  target: pytorch
  entry_point: torch._weights_only_unpickler.load
  statement: >
    The weights_only unpickler is robust across blind, structure-aware, and
    coverage-stable fuzzing; no defect found.
  kind: negative
  confidence: verified
  provenance:
    - machine-run:fuzz_weights_only blind, 6M runs clean
    - machine-run:fuzz_rebuild_args structure-aware meta-tensor, 13M runs clean
    - machine-run:fuzz_rebuild_args_stable coverage-stable, same cov:57 corridor
  observation: >
    Three independent harnesses, 6M+13M+ runs, all clean. Restricted unpickler
    needs LEGACY GLOBAL opcode not STACK_GLOBAL; persistent_load must return a
    TYPED storage. Coverage ceiling cov:57 (shallow corridor).
  boundary: >
    Robust on the reachable weights_only surface at stated effort. Does NOT cover
    the full torch.load (non-weights_only) surface, nor container zip-surgery
    beyond what was tested (CVE-2026-24747 defended on the tested machine).
  status: active
  refs: [targets/pytorch/]

