# ============================= AUDITS (M0 / scope) =========================

- id: C-0040
  date: 2026-08-13
  target: project
  statement: >
    Mainstream ML format parsers are saturated in OSS-Fuzz; mapfuzz's open ground
    is newer/smaller loaders and cross-cutting bug classes.
  kind: audit
  confidence: verified
  provenance:
    - source-read:OSS-Fuzz project.yaml present for numpy/hdf5/h5py/keras/tf/onnx/safetensors/sentencepiece
    - source-read:numpy fuzz_binary_loader (.npy/.npz), keras fuzz_serialization (deserialize_keras_object RCE surface)
  observation: >
    All mainstream format libs in OSS-Fuzz, including the juicy surfaces (numpy
    .npy/dtype, keras deserialize RCE, HDF5 file layer). GGUF/tokenizers-Rust/
    flax/minja/orbax/jax/msgpack/dreamerv3/lerobot all ABSENT (404).
  boundary: >
    "Saturated" means those specific surfaces are continuously fuzzed by others;
    does not mean they are bug-free, only that re-fuzzing duplicates professional
    work. Open-ground list is as of this date; OSS-Fuzz onboards over time.
  status: active
  refs: [docs/M0-baseline-audit.md]

- id: C-0041
  date: 2026-08-13
  target: minja
  statement: >
    minja (llama.cpp's C++ chat-template engine) is unfuzzed and is a real
    download-to-load-to-execute trust boundary.
  kind: audit
  confidence: verified
  provenance:
    - source-read:OSS-Fuzz jinja2 present (200) but minja/consumers absent (404)
    - source-read:no fuzzer in google/minja repo
    - source-read:chat templates ship in tokenizer_config and are parsed+rendered by llama.cpp
  observation: >
    jinja2 (Python) fuzzed; minja (C++ reimpl) and consumers (llama-cpp-python,
    ollama, vllm, transformers) all 404. Header-only, ~3077 lines.
  boundary: >
    Establishes the target is open and the boundary is real. Yielded two findings
    (C-0010, C-0011). Does not establish the interpreter is memory-unsafe (see
    the ongoing render campaign).
  status: active
  refs: [docs/M0-baseline-audit.md, targets/minja_template/]

# ============================= METHODS (lessons) =========================

- id: C-0050
  date: 2026-08-13
  target: project
  statement: >
    Structure-STABLE encoding (fixed-layout byte decode so one flipped byte
    changes one field) turns libFuzzer byte mutations into structural mutations,
    but only pays off on a rich surface.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0002
    - machine-run:found 0003 fast on tokenizer.json (rich); no gain on pytorch corridor
  observation: >
    tokenizer.json (branchy) yielded 0003 quickly under the stable generator;
    the pytorch meta-tensor path (cov ceiling 57) showed no gain.
  boundary: >
    Effective only where the target surface is rich/branchy. On shallow corridors
    or native-C surfaces (weak coverage feedback) it does not help.
  status: active
  refs: [docs/LESSONS.md]

- id: C-0051
  date: 2026-08-13
  target: project
  statement: >
    Dedup crashes by fault LOCATION, not artifact count; many artifacts routinely
    collapse to one root cause.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0020
    - machine-run:GGUF 14,724 artifacts = 1 bug; flax ~147 flagged = 1 .keys() site
  observation: >
    14,724 GGUF artifacts deduped to one div-by-zero; 147 flax from_state_dict
    flags to one .keys() site.
  boundary: >
    Location-dedup is necessary for honest counting; it does not by itself judge
    severity (a location can be benign UB, see C-0021).
  status: active
  refs: [chassis/triage.py, docs/LESSONS.md]

- id: C-0052
  date: 2026-08-13
  target: project
  statement: >
    A UBSan flag is not a finding until confirmed to crash a non-sanitized
    release build; several UBSan hits are defined-in-practice and do not crash.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0021
    - machine-run:signed-overflow and inf->long wrap/garbage in -O2, exit 0
    - machine-run:div/mod-by-zero DO crash -O2 (SIGFPE exit 136), so ARE findings
  observation: >
    Same campaign: signed-overflow and float-cast UBSan hits render values and
    exit 0 (non-findings); div/mod-by-zero UBSan hits crash with SIGFPE
    (findings). The non-sanitized test is the discriminator.
  boundary: >
    Distinguishes real crashes from benign UB. Does not address bugs that are
    memory-unsafe only under specific allocators/platforms; ASan is the check for
    those.
  status: active
  refs: [docs/LESSONS.md]

- id: C-0053
  date: 2026-08-13
  target: project
  statement: >
    A stored crashing input re-crashes on libFuzzer startup replay, so a
    persistent corpus must be minimized (-merge=1) or restarted from seeds after
    findings.
  kind: method
  confidence: observed
  provenance:
    - machine-run:accumulated minja corpus segfaulted on startup; empty/fresh corpus ran clean
  observation: >
    Campaigns from an accumulated corpus segfaulted at startup while empty-corpus
    fuzzing ran 60k clean. Individual seed files ran clean, so a specific
    accumulated input (or the merge pass) was the trigger.
  boundary: >
    Observed on WSL for the minja target; the exact poisoning input was not
    isolated. Remedy (fresh/minimized corpus) is confirmed to work; root cause of
    the dir-replay segfault is not fully established.
  status: active
  refs: [targets/minja_template/README.md]

- id: C-0054
  date: 2026-08-13
  target: project
  statement: >
    To fuzz PAST a known finding without disclosing a reproducer, apply the
    recommended fix to the vendored dependency (a fuzz-blocker) and keep it
    embargoed with the finding.
  kind: method
  confidence: verified
  provenance:
    - claim:C-0011
    - machine-run:patched minja div/mod guards to let the render campaign explore deeper
    - machine-run:GGUF 5-hunk fuzz-blocker precedent
  observation: >
    Patching the div/mod zero-guards into the vendored minja header let the
    campaign explore past 0005. UBSan -fsanitize-recover handles benign UB
    classes similarly. Fuzz-blockers for unreported bugs are disclosure artifacts.
  boundary: >
    The patched dependency is for hunting only; reproduction/confirmation for a
    report must use pristine upstream. Keep the two headers distinct.
  status: active
  refs: [docs/LESSONS.md]
